<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <!-- スマホで勝手に拡大・縮小されないようにする -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0a14">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0a14;
        /* 画面をなぞってもページがスクロールしたり跳ねたりしないようにする */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* iPhone のノッチやホームバーを避ける */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      /* 端末や窓の形によらず、常に 9:19.5 の縦長で表示する。
         はみ出す方向は letterbox（余白）になるので、盤面が切れることがない。 */
      #frame {
        position: relative;
        aspect-ratio: 9 / 19.5;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        background: #0b0a14;
        box-shadow: 0 0 48px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}};
        touch-action: none;
        outline: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #cfd3e6;
        font: 500 15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: #0b0a14;
      }
      #bar {
        width: 62%;
        max-width: 320px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      #bar > i {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #4aa3ff, #8ad0ff);
        transition: width 0.15s linear;
      }
      #error {
        display: none;
        padding: 0 24px;
        color: #ff9a9a;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="frame">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="loading">
          <div>Loading…</div>
          <div id="bar"><i></i></div>
          <div id="error"></div>
        </div>
      </div>
    </div>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var frame = document.querySelector("#frame");
      var loading = document.querySelector("#loading");
      var bar = document.querySelector("#bar > i");
      var errorBox = document.querySelector("#error");

      // 表示上の大きさ（CSS px）に描画解像度を合わせる。
      // これをしないと、高精細な画面でぼやけたり、逆に重くなったりする。
      function resize() {
        var ratio = Math.min(window.devicePixelRatio || 1, 2);
        var rect = frame.getBoundingClientRect();
        canvas.width = Math.max(1, Math.round(rect.width * ratio));
        canvas.height = Math.max(1, Math.round(rect.height * ratio));
      }
      resize();
      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", function () {
        // 端末の回転直後は大きさが確定していないことがあるので、少し待って測り直す
        setTimeout(resize, 120);
      });

      // 画面の二本指ズームと、ダブルタップによる拡大を止める
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        matchWebGLToCanvasSize: false,   // 大きさは上の resize() が受け持つ
      }, function (progress) {
        bar.style.width = (progress * 100) + "%";
      }).then(function (instance) {
        loading.style.display = "none";
        resize();
        // ブラウザは利用者が触るまで音を止める。最初の入力で Unity 側に知らせる。
        var notify = function () {
          try { instance.SendMessage("GameAudio", "UnlockFromBrowser"); } catch (e) { }
          window.removeEventListener("pointerdown", notify);
          window.removeEventListener("keydown", notify);
          window.removeEventListener("touchend", notify);
        };
        window.addEventListener("pointerdown", notify);
        window.addEventListener("keydown", notify);
        window.addEventListener("touchend", notify);
      }).catch(function (message) {
        loading.style.display = "flex";
        errorBox.style.display = "block";
        errorBox.textContent = message;
      });
    </script>
  </body>
</html>
