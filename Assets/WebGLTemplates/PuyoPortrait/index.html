<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <!-- スマホで勝手に拡大・縮小されないようにする -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0a14">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0a14;
        /* 画面をなぞってもページがスクロールしたり跳ねたりしないようにする */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #frame {
        position: fixed;
        inset: 0;
        /* スマホでは表示領域いっぱいに広げ、左右の黒帯を作らない。
           dvh はツールバーの出入りに追従するので、iOS Safari でも高さが揺れない。 */
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        margin: 0 auto;
        background: #0b0a14;
        overflow: hidden;
      }
      /* 横に広い窓（PCなど）だけは、間延びしないよう縦長を保って中央に置く。
         スマホの縦画面はこの条件に入らないので、いっぱいに広がる。 */
      @media (min-aspect-ratio: 3/4) {
        #frame {
          width: auto;
          aspect-ratio: 9 / 19.5;
          box-shadow: 0 0 48px rgba(0, 0, 0, 0.6);
        }
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}};
        touch-action: none;
        outline: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #cfd3e6;
        font: 500 15px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: #0b0a14;
      }
      #bar {
        width: 62%;
        max-width: 320px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      #bar > i {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #4aa3ff, #8ad0ff);
        transition: width 0.15s linear;
      }
      #error {
        display: none;
        padding: 0 24px;
        color: #ff9a9a;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div>Loading…</div>
        <div id="bar"><i></i></div>
        <div id="error"></div>
      </div>
    </div>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var frame = document.querySelector("#frame");
      var loading = document.querySelector("#loading");
      var bar = document.querySelector("#bar > i");
      var errorBox = document.querySelector("#error");

      // 表示上の大きさ（CSS px）に描画解像度を合わせる。
      // これをしないと、高精細な画面でぼやけたり、逆に重くなったりする。
      function resize() {
        var ratio = Math.min(window.devicePixelRatio || 1, 2);
        var rect = frame.getBoundingClientRect();
        var w = Math.max(1, Math.round(rect.width * ratio));
        var h = Math.max(1, Math.round(rect.height * ratio));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }
      resize();
      window.addEventListener("resize", resize);
      // iOS はツールバーの出入りでも表示領域が変わる
      if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
      window.addEventListener("orientationchange", function () {
        // 回転直後は大きさが確定していないことがあるので、少し待って測り直す
        setTimeout(resize, 120);
        setTimeout(resize, 400);
      });

      // 二本指ズームと、ダブルタップによる拡大を止める
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        matchWebGLToCanvasSize: false,   // 大きさは上の resize() が受け持つ
      }, function (progress) {
        bar.style.width = (progress * 100) + "%";
      }).then(function (instance) {
        loading.style.display = "none";
        resize();
        setupAudioUnlock(instance);
      }).catch(function (message) {
        loading.style.display = "flex";
        errorBox.style.display = "block";
        errorBox.textContent = message;
      });

      // ブラウザ（特に iOS Safari）は、利用者が触るまで音を止めている。
      // 解除は「操作の処理の中」で呼ぶ必要があるので、ここで受けて Unity 側へ渡す。
      function setupAudioUnlock(instance) {
        var events = ["pointerdown", "touchend", "click", "keydown"];
        var done = false;

        function tryUnlock() {
          // puyoResumeAudio は PuyoAudio.jslib が window に置く。
          // 1=鳴らせる 0=まだ止まっている -1=見つからない
          var state = window.puyoResumeAudio ? window.puyoResumeAudio() : -1;
          try { instance.SendMessage("GameAudio", "UnlockFromBrowser"); } catch (e) { }

          if (done || state === 0) return;   // 0 のときは次の操作でもう一度試す
          done = true;
          events.forEach(function (t) { window.removeEventListener(t, tryUnlock); });
        }

        events.forEach(function (t) {
          window.addEventListener(t, tryUnlock, { passive: true });
        });

        // タブから戻ったときに止められたままにならないようにする
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden && window.puyoResumeAudio) window.puyoResumeAudio();
        });
      }
    </script>
  </body>
</html>
